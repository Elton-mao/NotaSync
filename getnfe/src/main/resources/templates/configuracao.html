              <!-- Navbar content here if needed -->

                  <!-- Formulario de Cadastro de Diretório -->
<div class="row">
  <div class="col-md-12">
    <div class="card">
      <div class="card-header">
        <div class="card-title">Configuração de Diretórios</div>
      </div>

      <div class="card-body">
        <div class="row">
          <div class="col-md-6 col-lg-4">

            <form th:action="@{/admin/diretorios}" 
                  method="post" 
                  th:object="${DiretorioConfigForm}">

              <div class="form-group">

                <label for="tipoDiretorio">Tipo de Diretório *</label>
                <select class="form-control"
                        id="tipoDiretorio"
                        required
                        th:field="*{tipoDiretorio}">
                  <option value="" disabled selected>SELECIONE</option>
                  <option th:each="tipo : ${tiposDiretorio}"
                          th:value="${tipo}"
                          th:text="${tipo}">
                  </option>
                </select>

                <label for="caminhoDiretorio" class="mt-3">
                  Caminho do Diretório *
                </label>
                <input type="text"
                       class="form-control"
                       id="caminhoDiretorio"
                       placeholder="Ex: C:\Users\elton\Documentos\NotaSync"
                       required
                       th:field="*{caminhoDiretorio}" />

              </div>

              <button type="submit" class="btn btn-success mt-3">
                <span class="btn-label">
                  <i class="fa fa-check"></i>
                </span>
                Salvar
              </button>

            </form>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- fim formulario Cadastro de Diretório -->
<!-- Lista de Diretórios Configurados -->
<div class="row mt-4">
  <div class="col-md-12">
    <div class="card">

      <div class="card-header d-flex align-items-center justify-content-between">
        <div class="card-title fs-4">
          Diretórios Configurados
        </div>
      </div>

      <div class="card-body p-4">

        <div class="table-responsive">
          <table class="table table-hover table-bordered align-middle fs-5">
            <thead class="bg-light">
              <tr>
                <th style="width: 20%">Tipo</th>
                <th style="width: 60%">Caminho do Diretório</th>
                <th style="width: 20%" class="text-center">Status</th>
              </tr>
            </thead>

<tbody>
  <tr th:each="dir : ${configuracoes}">
    <td colspan="3">
      <a th:href="@{/admin/diretorios/{id}(id=${dir.id})}" 
         class="text-decoration-none text-dark d-flex justify-content-between align-items-center p-2"
         style="display: block;">
        <span class="fw-bold" th:text="${dir.tipoDiretorio}"></span>
        <span class="text-break" th:text="${dir.caminhoDiretorio}"></span>
        <span class="text-center">
          <span class="badge badge-success fs-6 px-3 py-2">
            <i class="fa fa-check-circle me-1"></i>
            Configurada
          </span>
        </span>
      </a>
    </td>
  </tr>

  <tr th:if="${#lists.isEmpty(configuracoes)}">
    <td colspan="3"
        class="text-center text-muted fs-5 py-4">
      Nenhum diretório configurado
    </td>
  </tr>
</tbody>

          </table>
        </div>

      </div>
    </div>
  </div>
</div>
<!-- Fim Lista de Diretórios Configurados -->

          <!-- fim formulario Cadastro-->
