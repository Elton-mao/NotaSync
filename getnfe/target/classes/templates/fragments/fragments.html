<!-- Sidebar Fragment -->
<div th:fragment="sidebar">
    <div class="sidebar" data-background-color="dark">
        <div class="sidebar-logo">
            <!-- Logo Header -->
            <div class="logo-header" data-background-color="dark">
                <a th:href="@{/dashboard}" class="logo">
                    <img
                        th:src="@{/assets/img/notaSyncLogo-removebg-preview.png}"
                        alt="navbar brand"
                        class="navbar-brand"
                        height="200"
                    />
                </a>
                <div class="nav-toggle">
                    <button class="btn btn-toggle toggle-sidebar">
                        <i class="gg-menu-right"></i>
                    </button>
                    <button class="btn btn-toggle sidenav-toggler">
                        <i class="gg-menu-left"></i>
                    </button>
                </div>
                <button class="topbar-toggler more">
                    <i class="gg-more-vertical-alt"></i>
                </button>
            </div>
            <!-- End Logo Header -->
        </div>

        <div class="sidebar-wrapper scrollbar scrollbar-inner">
            <div class="sidebar-content">
                <ul class="nav nav-secondary">

                    <!-- Dashboard -->
                    <li class="nav-item">
                        <a data-bs-toggle="collapse" href="#dashboard" class="collapsed" aria-expanded="false">
                            <i class="fas fa-home"></i>
                            <p>Dashboard</p>
                            <span class="caret"></span>
                        </a>
                        <div class="collapse" id="dashboard">
                            <ul class="nav nav-collapse">
                                <li>
                                    <a th:href="@{/dashboard}">
                                        <span class="sub-item">Indicadores Fiscais</span>
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </li>

                    <!-- Seção Consultas -->
                    <li class="nav-section">
                        <span class="sidebar-mini-icon">
                            <i class="fa fa-ellipsis-h"></i>
                        </span>
                        <h4 class="text-section">Consultas</h4>
                    </li>

                    <!-- NFe -->
                    <li class="nav-item">
                        <a data-bs-toggle="collapse" href="#base">
                            <i class="fas fa-layer-group"></i>
                            <p>NFe</p>
                            <span class="caret"></span>
                        </a>
                        <div class="collapse" id="base">
                            <ul class="nav nav-collapse">
                                <li>
                                    <a th:href="@{/notafiscal}">
                                        <span class="sub-item">Notas Fiscais de Entrada</span>
                                    </a>
                                </li>

                                <!-- Fornecedores -->
                                <li>
                                    <a data-bs-toggle="collapse" href="#fornecedores" class="collapsed" aria-expanded="false">
                                        <span class="sub-item">Fornecedores</span>
                                        <span class="caret"></span>
                                    </a>
                                    <div class="collapse" id="fornecedores">
                                        <ul class="nav nav-collapse subnav">
                                            <li>
                                                <a th:href="@{/emitente}">
                                                    <span class="sub-item">Lista de Fornecedores</span>
                                                </a>
                                            </li>
                                        </ul>
                                    </div>
                                </li>
                            </ul>
                        </div>
                    </li>

                    <!-- Seção Administração -->
                    <li class="nav-section">
                        <span class="sidebar-mini-icon">
                            <i class="fa fa-ellipsis-h"></i>
                        </span>
                        <h4 class="text-section">Administração</h4>
                    </li>

                    <!-- Administração do Sistema -->
                    <li class="nav-item">
                        <a data-bs-toggle="collapse" href="#administracao">
                            <i class="fas fa-cogs"></i>
                            <p>Administração do Sistema</p>
                            <span class="caret"></span>
                        </a>

                        <div class="collapse" id="administracao">
                            <ul class="nav nav-collapse">

                                <!-- Usuários -->
                                <li>
                                    <a data-bs-toggle="collapse" href="#usuarios" class="collapsed" aria-expanded="false">
                                        <span class="sub-item">Usuários</span>
                                        <span class="caret"></span>
                                    </a>

                                    <div class="collapse" id="usuarios">
                                        <ul class="nav nav-collapse subnav">
                                            <li>
                                                <a th:href="@{/usuarios}">
                                                    <span class="sub-item">Lista de Usuários</span>
                                                </a>
                                            </li>
                                            <li>
                                                <a th:href="@{/usuarios/cadastrar}">
                                                    <span class="sub-item">Cadastrar Usuário</span>
                                                </a>
                                            </li>
                                        </ul>
                                    </div>
                                </li>

                                <!-- Configurações do Sistema -->
                                <li>
                                    <a th:href="@{/configuracoes}">
                                        <span class="sub-item">Configurações do Sistema</span>
                                    </a>
                                </li>

                            </ul>
                        </div>
                    </li>

                </ul>
            </div>
        </div>
    </div>
</div>
<!-- End Sidebar Fragment -->
